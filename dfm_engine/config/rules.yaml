# DFM rule thresholds per manufacturing process.
# Tune these without touching code — the evaluator in rules.py reads them directly.
# All dimensions in mm unless noted.

# ── DIRECT processes ──────────────────────────────────────────────────────────

waterjet:
  plate_like_required: true
  min_sheet_thickness_mm: 0.5
  max_sheet_thickness_mm: 200.0
  min_slot_width_mm: 2.0
  min_hole_diameter_factor: 1.0
  max_hole_depth_to_diameter: null
  taper_warn_thickness_mm: 50.0
  denied_materials: []
  allowed_materials: []

laser_cut:
  plate_like_required: true
  min_sheet_thickness_mm: 0.1
  max_sheet_thickness_mm: 25.0
  min_slot_width_mm: 0.5
  min_hole_diameter_factor: 0.5
  max_hole_depth_to_diameter: null
  denied_materials:
    - copper
    - brass
    - polycarbonate
    - pvc
    - pvdf
  allowed_materials: []

fdm_3dprint:
  max_build_volume_mm: [500.0, 500.0, 500.0]
  min_wall_thickness_mm: 1.2
  warn_wall_thickness_mm: 1.5
  overhang_angle_warn_deg: 45.0

sla_3dprint:
  max_build_volume_mm: [300.0, 300.0, 400.0]
  min_wall_thickness_mm: 0.4
  warn_wall_thickness_mm: 0.6
  overhang_angle_warn_deg: 45.0

cnc_milling:
  min_internal_corner_radius_mm: 1.0
  max_hole_depth_to_diameter: 10.0
  min_wall_thickness_mm: 0.75
  warn_wall_thickness_mm: 1.5
  undercut_hard_fail: false

cnc_turning:
  rotational_symmetry_required: true
  max_aspect_ratio_for_non_symmetric_warn: 3.0
  min_internal_corner_radius_mm: 0.5
  max_hole_depth_to_diameter: 15.0
  min_wall_thickness_mm: 0.5
  warn_wall_thickness_mm: 0.75

# ── FORMING processes ─────────────────────────────────────────────────────────

sheet_metal:
  plate_like_required: true
  min_sheet_thickness_mm: 0.3
  max_sheet_thickness_mm: 12.0
  # Minimum bend radius as a multiple of sheet thickness (too tight → cracking)
  min_bend_radius_factor: 1.0        # r_bend >= 1 × t
  # Hole-to-bend minimum distance as multiple of sheet thickness
  min_hole_to_bend_factor: 1.5       # d_hole_to_bend >= 1.5 × t
  # Flange minimum length as multiple of sheet thickness
  min_flange_length_factor: 3.0      # L_flange >= 3 × t
  # Hole-to-edge minimum distance as multiple of hole diameter
  min_hole_to_edge_factor: 1.5       # d_hole_to_edge >= 1.5 × d_hole
  # Minimum slot / hole diameter as multiple of sheet thickness
  min_hole_diameter_factor: 1.0      # d_hole >= 1 × t
  allowed_materials:
    - steel
    - stainless steel
    - stainless
    - aluminium
    - aluminum
    - copper
    - brass
    - titanium
    - galvanized
    - mild steel
    - cold rolled steel
    - hot rolled steel

# ── TOOLED processes ──────────────────────────────────────────────────────────

urethane_casting:
  # Wall thickness: more lenient than hard tooling; silicone molds are forgiving
  min_wall_thickness_mm: 0.8
  warn_wall_thickness_mm: 1.2
  # Conservative global size limit (master pattern must fit in mold frame)
  max_build_volume_mm: [400.0, 400.0, 300.0]
  # Draft: silicone molds flex, so draft is a recommendation not a hard requirement
  draft_angle_warn_deg: 0.5
  # Undercut tolerance: higher than hard tooling — silicone molds peel off flexibly
  undercut_warn_only: true
  # Economic threshold: above this quantity, urethane casting is uneconomic
  economic_max_quantity: 50
  # Typical tooling lead time (silicone mold fabrication)
  tooling_lead_time_days_typical: 7
  # Tooling cost signal (indicative range — not a quote)
  tooling_cost_signal_inr: "₹5,000 – ₹25,000"
  allowed_materials:
    - polyurethane
    - PU
    - urethane
    - PU resin
    - Shore A
    - Shore D
    - rigid urethane
    - flexible urethane

